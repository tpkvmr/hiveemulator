name: communication-control-project

services:
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data:/data
    networks:
      - net1

  comm:
    build:
      context: ./src/CommunicationControl/DevOpsProject
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - Redis_ConnectionString=redis:6379
    depends_on:
      - redis
    networks:
      - net1

  hive:
    build:
      context: ./src/CommunicationControl/DevOpsProject.HiveMind.API
      dockerfile: Dockerfile
    ports:
      - "5149:5149"
    environment:
      - CommunicationConfiguration__CommunicationControlIP=comm
      - CommunicationConfiguration__CommunicationControlPort=8080
      - CommunicationConfiguration__RequestSchema=http
      - CommunicationConfiguration__CommunicationControlPath=api/v1/hive
      - CommunicationConfiguration__HiveIP=hive
      - CommunicationConfiguration__HivePort=5149
      - CommunicationConfiguration__HiveID=1
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - comm
    networks:
      - net1

  web:
    build: ./src/MapClient
    ports:
      - "80:80"
    stdin_open: true
    tty: true
    networks:
      - net1
  # ========== МОНІТОРИНГ ==========
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - hive-network

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - hive-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - hive-network

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - hive-network

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - hive-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    networks:
      - hive-network
      
networks:
  net1:
    driver: bridge